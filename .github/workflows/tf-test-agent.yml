name: tf-test-agent

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "modules/**"
      - "stacks/**"

permissions: {}

concurrency:
  group: tf-test-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: 1.12.2
  CLAUDE_CODE_VERSION: 2.1.301
  # The agent, its permissions and CI scripts come from the current base branch, never from the PR.
  TRUSTED: .tf-test-agent/trusted
  PLUGIN: .tf-test-agent/trusted/plugins/tf-test-agent
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  analyze:
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      trusted: ${{ steps.trusted.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: ${{ env.TRUSTED }}
          persist-credentials: false
      - id: trusted
        name: Pin the trusted base for all jobs
        # base.sha in the event is the base when the PR was opened; use the current one.
        run: echo "sha=$(git -C "$TRUSTED" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: targets
        name: Find changed modules and stacks
        env:
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ steps.trusted.outputs.sha }}
        run: |
          files="$(git diff --name-only "$BASE...$HEAD_SHA" -- modules stacks)"
          # On a new push keep only files this push changed. Files merged in from the
          # base branch are not part of the PR diff, so they drop out. After a force
          # push, analyze the whole PR.
          if [ "$ACTION" = synchronize ] \
             && git merge-base --is-ancestor "$BEFORE" "$HEAD_SHA" 2>/dev/null; then
            files="$(comm -12 <(sort <<< "$files") \
              <(git diff --name-only "$BEFORE" "$HEAD_SHA" -- modules stacks | sort))"
          fi
          dirs="$(grep -Ev '/tests/|\.md$' <<< "$files" | cut -d/ -f1-2 | sort -u || true)"
          for module in $(grep '^modules/' <<< "$dirs" || true); do
            dirs+=$'\n'"$(grep -l "\"../../$module\"" stacks/*/*.tf | xargs -r dirname || true)"
          done
          targets="$(sort -u <<< "$dirs" | while read -r d; do if [ -d "$d" ]; then echo "$d"; fi; done | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          echo "Targets: $targets"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  agent:
    needs: analyze
    if: needs.analyze.outputs.targets != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TARGETS: ${{ needs.analyze.outputs.targets }}
      BASE: ${{ needs.analyze.outputs.trusted }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.analyze.outputs.trusted }}
          path: ${{ env.TRUSTED }}
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install Claude Code
        run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Prepare the agent's input
        run: |
          # Agent instructions in the PR would be loaded as context. --bare would skip
          # them, but it also removes the Skill and Write tools the agent needs.
          find . -path ./.tf-test-agent -prune -o \
            \( -name CLAUDE.md -o -name CLAUDE.local.md -o -name AGENTS.md -o -name .claude \) -print \
            -exec rm -rf {} +
          mapfile -t targets < <(jq -r '.[]' <<< "$TARGETS")
          git diff "$BASE...$HEAD_SHA" -- "${targets[@]}" > .tf-test-agent/pr.diff

      - name: Run the agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_PLATFORM_API_KEY }}
          TF_TEST_AGENT_MODEL: ${{ vars.TF_TEST_AGENT_MODEL || 'haiku' }}
          TF_TEST_AGENT_MAX_USD: ${{ vars.TF_TEST_AGENT_MAX_USD || '1' }}
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/tf-plugins
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          mapfile -t targets < <(jq -r '.[]' <<< "$TARGETS")
          status=0
          "$PLUGIN/ci/run-agent.sh" pr .tf-test-agent/pr.diff .tf-test-agent "${targets[@]}" || status=$?
          git add --intent-to-add --all -- modules stacks
          git diff --binary -- modules stacks > .tf-test-agent/agent.patch
          git diff --stat -- modules stacks
          [ "$status" -eq 0 ] || echo "::warning::The agent exited with status $status."

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: agent
          path: |
            .tf-test-agent/report.json
            .tf-test-agent/agent.patch
            .tf-test-agent/transcript.jsonl
            .tf-test-agent/prompt.txt
          retention-days: 14

  verify:
    needs: [analyze, agent]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TARGETS: ${{ needs.analyze.outputs.targets }}
    outputs:
      ok: ${{ steps.verify.outputs.ok }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.analyze.outputs.trusted }}
          path: ${{ env.TRUSTED }}
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent
          path: .tf-test-agent/agent

      - name: Apply the agent's patch
        run: |
          if [ -s .tf-test-agent/agent/agent.patch ]; then
            git apply .tf-test-agent/agent/agent.patch
          fi
          git status --short -- modules stacks

      - id: verify
        name: Verify scope, tests and mutation proof
        env:
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/tf-plugins
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          if python3 "$PLUGIN/ci/verify.py" --targets "$TARGETS" \
               --report .tf-test-agent/agent/report.json --out .tf-test-agent/verify.json; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verify
          path: .tf-test-agent/verify.json
          retention-days: 14

  publish:
    needs: [analyze, agent, verify]
    if: always() && needs.analyze.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      checks: write
    env:
      TARGETS: ${{ needs.analyze.outputs.targets }}
      VERIFIED: ${{ needs.verify.outputs.ok }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.analyze.outputs.trusted }}
          path: ${{ env.TRUSTED }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: agent
          path: .tf-test-agent/agent
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: verify
          path: .tf-test-agent

      - id: patch
        name: Apply the verified patch
        if: env.VERIFIED == 'true'
        run: |
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "::warning::The branch moved during the run. Nothing committed; the next run covers the new commits."
          elif [ -s .tf-test-agent/agent/agent.patch ]; then
            git apply .tf-test-agent/agent/agent.patch
            python3 "$PLUGIN/ci/verify.py" --scope-only --targets "$TARGETS" \
              --report .tf-test-agent/agent/report.json --out .tf-test-agent/scope.json
            echo "apply=true" >> "$GITHUB_OUTPUT"
          fi

      - id: commit
        if: steps.patch.outputs.apply == 'true'
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          file_pattern: modules stacks
          commit_message: |
            test: add tests from tf-test-agent

            Verified by CI: scope, test run and mutation proof.
            Run: ${{ env.RUN_URL }}

            [skip actions]
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>

      - id: render
        name: Render results
        env:
          COMMIT: ${{ steps.commit.outputs.commit_hash }}
        run: |
          python3 "$PLUGIN/ci/render.py" --targets "$TARGETS" \
            --report .tf-test-agent/agent/report.json --verify .tf-test-agent/verify.json \
            --transcript .tf-test-agent/agent/transcript.jsonl \
            --comment .tf-test-agent/comment.md --check .tf-test-agent/check.json \
            --commit "$COMMIT" --run-url "$RUN_URL"
          cat .tf-test-agent/comment.md >> "$GITHUB_STEP_SUMMARY"

      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: tf-test-agent
          path: .tf-test-agent/comment.md

      - uses: LouisBrunner/checks-action@937cbbcde3259005b50746dc91cde29098aac2ff # v3.1.0
        with:
          token: ${{ github.token }}
          name: tf-test-agent
          sha: ${{ steps.commit.outputs.commit_hash || env.HEAD_SHA }}
          conclusion: ${{ steps.render.outputs.conclusion }}
          output: ${{ steps.render.outputs.output }}
          annotations: ${{ steps.render.outputs.annotations }}
